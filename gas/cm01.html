<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIメモSA管理</title>
<style>
  :root { --bg:#f4f6fa; --card:#fff; --ink:#1f2937; --sub:#5b6676; --line:#dfe4ec; --warn:#b45309; --bad:#b42318; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--ink);
    font-family:"Yu Gothic UI","Meiryo UI","Hiragino Sans",system-ui,sans-serif; line-height:1.7; padding:16px; }
  .card { max-width:520px; width:100%; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px 28px 24px; box-shadow:0 6px 24px rgba(31,41,55,.06); }
  .mark { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; margin-bottom:14px; background:#fdecea; color:var(--bad); }
  .mark.auth { background:#fff4e5; color:var(--warn); }
  .mark.communication { background:#eef2ff; color:#3949ab; }
  h1 { font-size:18px; margin:0 0 8px; }
  p { margin:0 0 10px; color:var(--sub); }
  .msg { color:var(--ink); font-size:15px; }
  button { margin-top:8px; padding:9px 18px; border:1px solid var(--line); background:#fff; border-radius:8px; font-size:14px; cursor:pointer; }
</style></head>
<body>
  <main class="card" role="alert">
    <div class="mark <?= kind ?>"><?= kind === 'auth' ? '🔑' : (kind === 'communication' ? '📡' : '⛔') ?></div>
    <h1><?= kind === 'auth' ? '本人を確認できませんでした' : (kind === 'communication' ? '通信に問題が起きました' : 'この画面は使えません') ?></h1>
    <p class="msg"><?= message ?></p>
    <p>データは表示も変更もされていません。</p>
    <button type="button" onclick="location.reload()">もう一度開く</button>
  </main>
</body></html>
