<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font:14px/1.6 sans-serif;margin:16px}pre{background:#f4f4f4;padding:8px;white-space:pre-wrap;word-break:break-all}.ok{color:#0a7a2f}.ng{color:#b00020}</style></head>
<body><h3>工程00 技術検証（件数・判定結果のみ表示）</h3><div id="log"></div>
<script>
var summary = {};
function say(t, cls){ var d=document.createElement('div'); d.className=cls||''; d.textContent=t; document.getElementById('log').appendChild(d); }
function srv(fn){ var a=Array.prototype.slice.call(arguments,1); return new Promise(function(res){ google.script.run.withSuccessHandler(function(v){res({ok:true,v:v});}).withFailureHandler(function(e){res({ok:false,e:String(e&&e.message||e)});})[fn].apply(null,a); }); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
async function step(name, fn){ say('実行中: '+name); var t=Date.now(); try{ var r=await fn(); summary[name]=r; say('完了: '+name+' ('+(Date.now()-t)+'ms)', 'ok'); return r; }catch(e){ summary[name]={error:String(e)}; say('失敗: '+name+' '+e, 'ng'); } }
function pwaInfo(){
  return { isSecureContext: window.isSecureContext, originHost: location.hostname.replace(/^[^.]+\./, '*.'),
    serviceWorkerApi: 'serviceWorker' in navigator, manifestLink: !!document.querySelector('link[rel=manifest]'),
    standalone: window.matchMedia('(display-mode: standalone)').matches, width: window.innerWidth,
    platform: (navigator.userAgentData && navigator.userAgentData.platform) || (/iPhone|iPad/.test(navigator.userAgent) ? 'iOS' : /Android/.test(navigator.userAgent) ? 'Android' : 'PC') };
}
(async function(){
  // ① 取込の冪等性
  await step('1_取込の冪等性', async function(){
    await srv('t1Reset'); var a=await srv('t1Import'); var b=await srv('t1Import'); return {first:a.v||a, second:b.v||b}; });
  // ② 本人判定・他営業所分離
  await step('2a_本人判定', async function(){ return await srv('t2Judge'); });
  await step('2a_他営業所分離', async function(){ return await srv('t2Branch'); });
  await step('3_拒否の判定', async function(){ return await srv('t3Gate'); });
  // ③(A) GAS内の画面：この画面自体が google.script.run で動いている。参考として、画面の中から /exec を fetch した結果も取る（独立画面の近似）。
  await step('3A_画面内からの/exec呼び出し', async function(){
    var u=await srv('getExecUrl'); if(!u.ok) return u; var out={};
    async function tryFetch(label, opt){ try{ var r=await fetch(u.v+'?action=whoami', opt); var t=await r.text(); var j=null; try{j=JSON.parse(t);}catch(e){} out[label]={status:r.status,type:r.type,redirected:r.redirected,json:!!j,allowed:j&&j.allowed,role:j&&j.role,head:j?'':t.slice(0,60)}; }catch(e){ out[label]={error:String(e&&e.message||e)}; } }
    await tryFetch('credentials_include',{credentials:'include'});
    await tryFetch('credentials_omit',{credentials:'omit'});
    return out; });
  // ④ 同時操作（2回同時を3ラウンド）
  await step('4_直列と途中失敗', async function(){ return await srv('t4Serial'); });
  await step('4_同時引受', async function(){
    var rounds=[];
    for (var i=0;i<3;i++){
      var id='R'+(4+i);
      var rs=await Promise.all([srv('claim',id,'userA',1,2000,false), srv('claim',id,'userB',1,0,false)]);
      rounds.push(rs.map(function(x){return x.ok?x.v:x;}));
    }
    var st=await srv('t4Read'); return {rounds:rounds, finalState:st.v}; });
  // ⑤ Drive
  await step('5_Drive', async function(){ return await srv('t5Drive'); });
  // ⑥ OpenAI（架空の文のみ）
  var models=await step('6_モデル一覧', async function(){ return await srv('t6Models'); });
  var list=(models&&models.v&&models.v.gptLike)||[]; var pref=['gpt-4o-mini','gpt-4.1-mini','gpt-5-mini','gpt-4.1-nano','gpt-5-nano','gpt-4o']; var model=pref.filter(function(m){return list.indexOf(m)>=0;})[0]||(list.filter(function(m){return /mini/.test(m);})[0])||list[0];
  summary.model=model; say('使うモデル: '+model);
  if(model){ await step('6_5項目抽出(架空)', async function(){ return await srv('t6Extract', model); });
             await step('6_再試行', async function(){ return await srv('t6BadRequest', model); }); }
  // ⑦ 新着表示（3秒ごとに問い合わせる画面で、行を足してから画面に出るまでの秒数を5回測る）
  await step('7_新着表示', async function(){
    await srv('t7Reset'); var latest=(await srv('t7Count')).v||0; var polls=0;
    var timer=setInterval(async function(){ var c=await srv('t7Count'); polls++; if(c.ok) latest=c.v; }, 3000);
    var trials=[];
    for (var i=0;i<5;i++){
      var base=latest; await sleep(500+Math.floor(Math.random()*2500));
      var add=await srv('t7Add'); var t0=Date.now(); var waited=0;
      while(latest<=base && waited<20000){ await sleep(200); waited+=200; }
      trials.push(latest>base ? Math.round((Date.now()-t0)/100)/10 : null);
    }
    clearInterval(timer);
    var ok=trials.filter(function(x){return x!==null;});
    return {pollIntervalSec:3, trialsSeconds:trials, maxSeconds:ok.length?Math.max.apply(null,ok):null, polls:polls}; });
  // ⑨(A) PWA条件（この画面の中で）
  await step('9A_PWA条件', async function(){
    var info=pwaInfo(); try{ await navigator.serviceWorker.register('/sw.js'); info.swRegister='ok'; }catch(e){ info.swRegister='ng: '+String(e&&e.message||e).slice(0,100); } return info; });
  await srv('savePage', summary);
  say('全試験が終わりました。この画面を閉じて構いません。','ok');
  var pre=document.createElement('pre'); pre.textContent=JSON.stringify(summary,null,1).slice(0,5000); document.getElementById('log').appendChild(pre);
})();
</script></body></html>
